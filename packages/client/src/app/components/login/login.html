<div class="login-container">
    <app-particle-background [collapse]="loginState() === 'success'"></app-particle-background>

    <!-- Theme Toggle (Top Right) -->
    <div class="absolute top-4 right-4 z-50 animate-enter" [class.fade-out]="loginState() === 'success'">
        <button mat-icon-button (click)="toggleTheme()" [matTooltip]="'Theme: ' + themeService.theme()"
            class="text-[var(--app-theme-text-primary)]">
            <mat-icon>{{ themeService.theme() === 'dark' ? 'dark_mode' : 'light_mode' }}</mat-icon>
        </button>
    </div>

    <!-- Header Section -->
    <header class="relative z-10 flex flex-col items-center" [class.animate-enter]="loginState() !== 'success'"
        style="position: absolute; top: 12%; left: 0; right: 0;" [class.logo-drop]="loginState() === 'success'">
        <app-waypoint-icon class="w-64 h-auto mb-4 drop-shadow-[0_0_15px_rgba(139,92,246,0.5)]"></app-waypoint-icon>
        <!-- <h1 class="sr-only">Waypoint</h1> -->
    </header>

    <!-- Login Card aka Auth Card -->
    <!-- Add 'expanding' class on success -->
    <main class="login-card animate-enter delay-100" [class.expanding]="loginState() === 'success'"
        [ngClass]="cardWidthClass()">

        <!-- Content fades out on success -->
        <div class="card-content" [class.fade-out]="loginState() === 'success'">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>
