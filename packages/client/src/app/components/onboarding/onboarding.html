<div class="onboarding-content">
    <mat-card-header class="justify-center mb-6">
        <mat-card-title class="!text-3xl !font-bold">Welcome to Waypoint</mat-card-title>
    </mat-card-header>

    <mat-card-content>
        <div class="text-center mb-6 text-slate-400">
            <p *ngIf="step() === 1">Let's set up your profile.</p>
            <p *ngIf="step() === 2">Let's add your bank or institution.</p>
            <p *ngIf="step() === 3">Let's create your first vault.</p>
        </div>

        <!-- Step 1: Profile -->
        <div *ngIf="step() === 1" class="flex flex-col gap-4 max-w-lg mx-auto">
            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Display Name</mat-label>
                <input matInput [(ngModel)]="username" placeholder="e.g. Satoshi Nakamoto">
            </mat-form-field>

            <button mat-flat-button color="primary" class="w-full !py-6 !text-lg !rounded-xl" (click)="saveProfile()"
                [disabled]="isLoading() || !username()">
                {{ isLoading() ? 'Saving...' : 'Next' }}
            </button>
        </div>

        <!-- Step 2: Institute -->
        <div *ngIf="step() === 2" class="flex flex-col gap-4 max-w-lg mx-auto">
            <div class="p-4 rounded-xl bg-emerald-900/20 border border-emerald-800 text-sm mb-2 text-center">
                Profile saved! Next, add your primary institution.
            </div>

            <app-institute-form #instituteForm></app-institute-form>

            <button mat-flat-button color="primary" class="w-full !py-6 !text-lg !rounded-xl"
                (click)="createInstitute()" [disabled]="isLoading() || (instituteForm && instituteForm.invalid)">
                {{ isLoading() ? 'Creating...' : 'Next' }}
            </button>
        </div>

        <!-- Step 3: First Account -->
        <div *ngIf="step() === 3" class="flex flex-col gap-4 max-w-lg mx-auto">
            <div class="p-4 rounded-xl bg-emerald-900/20 border border-emerald-800 text-sm mb-2 text-center">
                Institute added! Now, create a vault.
            </div>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Vault Name</mat-label>
                <input matInput [(ngModel)]="accountName" placeholder="e.g. Main Vault">
            </mat-form-field>

            <mat-form-field appearance="outline" class="w-full">
                <mat-label>Currency</mat-label>
                <mat-select [(ngModel)]="currency">
                    <mat-option value="USD">USD ($)</mat-option>
                    <mat-option value="EUR">EUR (€)</mat-option>
                    <mat-option value="GBP">GBP (£)</mat-option>
                    <mat-option value="JPY">JPY (¥)</mat-option>
                    <mat-option value="AUD">AUD ($)</mat-option>
                </mat-select>
            </mat-form-field>

            <button mat-flat-button color="primary" class="w-full !py-6 !text-lg !rounded-xl" (click)="createVault()"
                [disabled]="isLoading() || !accountName()">
                {{ isLoading() ? 'Creating...' : 'Get Started' }}
            </button>
        </div>

        <div *ngIf="error()"
            class="mt-4 p-3 bg-red-900/20 border border-red-800 rounded text-red-200 text-sm text-center max-w-lg mx-auto">
            {{ error() }}
        </div>

        <!-- Logout / Switch Account -->
        <div class="mt-8 pt-4 text-center">
            <button mat-button color="warn" (click)="authService.signOut()">
                Switch Account / Logout
            </button>
        </div>
    </mat-card-content>
</div>
