<div class="w-full h-full min-h-[250px] flex items-center justify-center">
    @if (chartData().length > 0) {
    <ngx-charts-area-chart [scheme]="colorScheme" [results]="chartData()" [gradient]="gradient" [xAxis]="showXAxis"
        [yAxis]="showYAxis" [legend]="showLegend" [showXAxisLabel]="showXAxisLabel" [showYAxisLabel]="showYAxisLabel"
        [autoScale]="true" style="display: block; width: 100%; height: 100%;">
    </ngx-charts-area-chart>
    } @else {
    <span>Loading chart...</span>
    }
</div>
